                    armPivot.position.x = THREE.MathUtils.lerp(armPivot.position.x, targetX, 0.15);
                    armPivot.position.z = 0.15;
                    batGroup.rotation.set(0.4, -Math.PI / 3, 0.8 + idleBatShake);
                    pawaBatter.body.position.y = 0.35 + idleWiggleY * 0.3;
                    buntBodyShiftCur = 0;
                    playerGroup.position.x = 1.1;
                }
                applyBuntCrouchParts(buntBlend);
                pawaBatter.headGroup.rotation.y = BATTER_FACE_YAW + Math.sin(idleTimer * 1.5) * 0.03;
            }

            renderer.render(scene, camera);
            drawFieldRadar();
        }

        // --- 11. 操作イベントハンドラ ---
        function handlePointerMove(clientX, clientY) {
            if (isDragging && (gameState === 'pitching' || gameState === 'windup')) {
                let dx = clientX - dragStartX;
                let dy = clientY - dragStartY;
                let targetX = cursorStartX + dx * cursorSensitivity;
                let targetY = cursorStartY - dy * cursorSensitivity;
                cursorGroup.position.x = Math.max(-1.2, Math.min(1.2, targetX));
                cursorGroup.position.y = Math.max(0.35, Math.min(1.55, targetY));
            }
        }

        function handlePointerStart(clientX, clientY) {
            sound.init();
            if (gameState === 'pitching' || gameState === 'windup' || gameState === 'pre_pitch_wait') {
                if (buntMode) {
                    if (!buntStance) buntStanceTier = currentBuntTimingTier(); // 構え始めたタイミングを記録
                    buntStance = true; // バント：スワイプを始めた瞬間に屈んでバットを水平に構える
                }
                isDragging = true;
                dragStartX = clientX;
                dragStartY = clientY;
                cursorStartX = cursorGroup.position.x;
                cursorStartY = cursorGroup.position.y;
            }
        }

        function handlePointerEnd() {
            if (isDragging) {
                isDragging = false;
                if (buntMode) {
                    // バント：指を離す＝バットを引いて見送る（振った扱いにはならない）。ボール球なら「ボール」になる
                    buntStance = false;
                    return;
                }
                if (!isSwinging && (gameState === 'pitching' || gameState === 'windup' || gameState === 'pre_pitch_wait')) {
                    if (gameState === 'pre_pitch_wait') {
                        // 1秒の構え待ち中にスイング操作された場合は、投球開始時に振る。
                        pendingSwingInput = true;
                    } else {
                        isBunting = buntMode;
                        isSwinging = true;
                        swingProgress = 0;
                        swungOnCurrentPitch = true;
                        sound.playSwing();
                    }
                }
            }
        }

        // 盗塁ボタンは1回触るだけ。押すと盗塁＋エンドランを予約し、
        // ピッチャーの投球開始と同時に走者と打者が動き出す。
        function setupStealButton(buttonId, fromBase, toBase, successRate) {
            const btn = document.getElementById(buttonId);
            if (!btn) return;
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.button !== undefined && e.button !== 0) return;
                attemptSteal(fromBase, toBase, successRate);
            });
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); }, { passive: false });
            btn.addEventListener('mousedown', (e) => e.stopPropagation());
        }

        setupStealButton('steal12Btn', 1, 2, 0.50);
        setupStealButton('steal23Btn', 2, 3, 0.10);
        setupStealButton('steal3HBtn', 3, 4, 0.0);   // 3塁→本塁：成功率0%。打者が当てたとき（スクイズ／エンドラン）だけ得点のチャンス

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            if (e.key.toLowerCase() === 's') attemptSteal(1, 2, 0.50);
            if (e.key.toLowerCase() === 'd') attemptSteal(2, 3, 0.10);
            if (e.key.toLowerCase() === 'f') attemptSteal(3, 4, 0.0);
            if (e.key.toLowerCase() === 'b') toggleBuntMode();
        });

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest && e.target.closest('.steal-btn')) return;
            handlePointerStart(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => { if (isDragging) handlePointerMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', handlePointerEnd);

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest && e.target.closest('.steal-btn')) return;
            if (e.touches.length > 0) {
                if (e.cancelable) e.preventDefault();
                handlePointerStart(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length > 0) {
                if (e.cancelable) e.preventDefault();
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (e.cancelable) e.preventDefault();
            handlePointerEnd();
        });

        // --- ゲーム開始 ---
        updateUI();
        adjustCameraParameters();
        camera.position.copy(camDefault);
        camera.lookAt(camLookTarget);
        pitchBall();
        animate();
    </script>
</body>
</html>
