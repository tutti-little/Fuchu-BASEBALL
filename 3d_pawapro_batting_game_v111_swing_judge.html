            document.getElementById('battingTeamDisplay').innerText = "攻撃: " + (isTeamA ? "Aチーム" : "Bチーム");
            updateVisualRunners();
            updateStealButtons();
        }

        function showTxt(text, className) { 
            const t = document.getElementById('timingInfo'); 
            t.innerText = text; t.className = className; t.style.opacity = 1; 
        }

        function moveRunners(bases) {
            let nextR = [false, false, false];
            let runs = 0;
            for (let b = 0; b < 3; b++) { 
                if (runners[b]) { 
                    let n = b + bases; 
                    if (n < 3) nextR[n] = true; 
                    else runs++;
                } 
            }
            if (bases < 4) nextR[bases - 1] = true; else runs++;
            runners = nextR;
            if (runs > 0) { if (isTeamA) scoreA += runs; else scoreB += runs; sound.playCheer(); }
            return runs;
        }

        function syncRunnersArrayFrom3D() {
            let nextR = [false, false, false];
            let runs = 0;
            activeRunners.forEach(r => {
                if (r.isActive) {
                    if (r.currentSegment === 1) nextR[0] = true;
                    else if (r.currentSegment === 2) nextR[1] = true;
                    else if (r.currentSegment === 3) nextR[2] = true;
                }
            });
            runners = nextR;
            updateVisualRunners();
            return runs;
        }

        function advanceForWalk() {
            let runs = 0; 
            let nextR = [...runners];
            if (runners[0] && runners[1] && runners[2]) { runs = 1; }
            else if (runners[0] && runners[1]) { nextR[2] = true; }
            else if (runners[0]) { nextR[1] = true; }
            nextR[0] = true;
            runners = nextR;
            if (runs > 0) { if (isTeamA) scoreA += runs; else scoreB += runs; sound.playCheer(); }
            return runs;
        }

        // --- 9. 投球リセット & ホームラン処理システム ---
        // 変化球の曲がり具合の倍率（1.0 = 元の曲がり、小さいほど曲がらない）
        const BREAK_SCALE = 0.3;
        // ストレート・スライダー・フォークの球速倍率（1.0 = 元の球速。カーブは対象外）
        const DISPLAY_KM_SCALE = 440;  // 画面に出る球速(km/h)の換算係数。大きいほど表示が速くなる（実際の球速には影響しない。元: 380）
        const SPEED_UP = 1.08;
        const STRAIGHT_EXTRA_SPEED_UP = 1.02; // ストレートだけさらに少し速く
        const FORK_EXTRA_SPEED_UP = 1.06;     // フォークだけさらに少し速く
        // ストレートのホップ（伸び）：終盤に上へ浮き上がる量と、浮き始める位置（投球区間の何割目から）
        const HOP_RISE = 0.1;
        const HOP_START = 0.4;
        // フォーク：ここまでほぼ真っ直ぐ・水平に来て、この割合を過ぎてから急に沈む（1に近いほど本塁付近で急に落ちる）
        const FORK_BREAK_START = 0.78;
        const FORK_SIDE_SCALE = 0.3;  // フォークの横移動の大きさ（1.0 = 元どおり。0 で横にまったく動かない。小さいほど真っ直ぐ来る）
        const FORK_DROP_SCALE = 0.48; // 落差の大きさ（1.0で放った高さと狙いの高さの差ぶんそのまま沈む。小さいほど落差が小さい）
        const pitchTypes = [
            // ストレートは一切曲がらず、狙った位置まで真っ直ぐ進む
            { name: "ストレート", speedMin: 0.25 * SPEED_UP * STRAIGHT_EXTRA_SPEED_UP, speedMax: 0.30 * SPEED_UP * STRAIGHT_EXTRA_SPEED_UP, curveX: 0, curveY: 0, straight: true },
            { name: "カーブ", speedMin: 0.17, speedMax: 0.21, curveX: -0.0006 * BREAK_SCALE, curveY: -0.0008 * BREAK_SCALE },
            { name: "スライダー", speedMin: 0.20 * SPEED_UP, speedMax: 0.24 * SPEED_UP, curveX: -0.0008 * BREAK_SCALE, curveY: -0.0002 * BREAK_SCALE, noRise: true },
            { name: "フォーク", speedMin: 0.18 * SPEED_UP * FORK_EXTRA_SPEED_UP, speedMax: 0.22 * SPEED_UP * FORK_EXTRA_SPEED_UP, curveX: 0, curveY: 0, lateBreak: true }
        ];

        let activePitchConfig = null;

        function triggerHomerun() {
            sound.playCheer();
            
            let runnersOnBase = 0;
            for (let i = 0; i < 3; i++) {
                if (runners[i]) runnersOnBase++;
            }
            let totalRuns = runnersOnBase + 1;

            let hrMsg = "HOMERUN!!!";
            if (totalRuns === 4) hrMsg = "満塁ホームラン!!!!!";
            else if (totalRuns === 3) hrMsg = "3ランホームラン!!!";
            else if (totalRuns === 2) hrMsg = "2ランホームラン!!";
            else hrMsg = "ソロホームラン!!";

            showTxt(`${hrMsg} (+${totalRuns}点)`, "hr");

            activeRunners.forEach(r => {
                if (r.isActive) {
                    r.holdProgress = null; // ハーフウェイ待機を解除（これを忘れると走者が途中で固まる）
                    r.targetSegment = 4;
                    r.speed = 0.008;
                }
            });
            if (batterRunner && batterRunner.isActive) {
                batterRunner.targetSegment = 4;
                batterRunner.speed = 0.008;
            }

            endEndRunState(); // エンドラン中のホームランでも、次の投球が止まらないように状態を終了
            if (isTeamA) scoreA += totalRuns; else scoreB += totalRuns;
            runners = [false, false, false];
            
            balls = 0;
            strikes = 0;
            updateUI();

            setTimeout(() => {
                gameState = 'waiting';
                pitchBall();
            }, 5000);
        }

        function pitchBall() {
            // 結果表示を消して、ピッチャーとバッターが構える画面へ切り替える。
            // ここから「構えている時間」を1秒取ってから投球動作を始める。
            if (pitchGapActive) return;
            pitchGapActive = true;
            gameState = 'between_pitches';
            isDragging = false;
            isSwinging = false;
            isBunting = false;
            buntAuto = false;
            buntStance = false;
            buntStanceTier = null;
            buntBlend = 0;
            buntBodyShiftCur = 0;
            applyBuntCrouchParts(0);
            document.getElementById('timingInfo').style.opacity = 0;
            updateStealButtons();
            setTimeout(() => {
                pitchGapActive = false;
                pitchBallStart();
            }, 50);
        }

        function pitchBallStart() {
            // 打者がボールに当てたエンドランは、盗塁送球の決着待ちが起きないので待たずに終了する
            if (stealAnimation && stealAnimation.madeContact) endEndRunState();
            if (stealAnimation && !stealAnimation.finished) {
                setTimeout(pitchBallStart, 250);
                return;
            }
            tagUpPlayActive = false;
            // タッチアップで走っている走者がいる間は、次の投球を待つ（得点が入る前にリセットされないように）
            if (activeRunners.some(r => r.isActive && r.tagUpRunning)) {
                setTimeout(pitchBallStart, 250);
                return;
            }
            hitRunPlan = null;
            gameState = 'windup'; 
            pitchEval = false; 
            hasBounced = false; 
            hitLaunchAngleDeg = null;
            isFairConfirmed = false; 
            swungOnCurrentPitch = false;
            pendingSwingInput = false;
            currentThrow = null;
            playResult = "";
            document.getElementById('timingInfo').style.opacity = 0; 
            ballMarker.visible = false;
            cursorGroup.position.set(0, 0.95, 1.82);
            resetSwingTrail();
            
            adjustCameraParameters();
            camera.position.copy(camDefault); 
            camera.lookAt(camLookTarget);
            
            activeRunners.forEach(r => r.reset());
            let rIdx = 0;
            for (let i = 0; i < 3; i++) {
                if (runners[i]) {
                    activeRunners[rIdx].spawn(i + 1, i + 1); 
                    rIdx++;
                }
            }
            batterRunner = null;
            
            playerGroup.visible = true; 
            playerGroup.position.set(1.1, 0, 1.8);
            playerGroup.rotation.set(0, 0, 0); 
            pawaBatter.headGroup.rotation.set(0.1, BATTER_FACE_YAW, 0);
            pawaBatter.leftLegGroup.rotation.set(0, BATTER_FOOT_YAW, 0);
            pawaBatter.rightLegGroup.rotation.set(0, BATTER_FOOT_YAW, 0);
            armPivot.position.set(-0.1, 0.4, 0.15);
            armPivot.rotation.set(0, 0, 0); 
            batGroup.rotation.set(0.4, -Math.PI / 3, 0.8);

            deactivateBuntCatcher(); // バント用の捕手は次の投球までに外す
            fielders.forEach((f, i) => {
                f.position.set(fPos[i][0], fPos[i][1], fPos[i][2]);
                f.lookAt(0, 0, 1.8);
            });
            
            basemen.forEach((b, i) => {
                b.group.position.copy(BASEMAN_STAND[i]);
                b.group.lookAt(0, 0, i === 3 ? -16.5 : 1.8);
                b.leftHand.position.set(-0.35, 0.4, 0.15);
                b.rightHand.position.set(0.35, 0.4, 0.15);
                b.group.visible = false; // 次のプレーまで非表示（送球時に設置）
            });
            
            pitcherObj.group.rotation.y = Math.PI / 4;
            pitcherObj.rightHand.position.set(0.35, 0.9, 0);
            windupProgress = 0;
            
            let pType = pitchTypes[Math.floor(Math.random() * pitchTypes.length)];
            currentPitchType = pType.name;
            activePitchConfig = pType;

            let isStrikeTarget = Math.random() < 0.75;
            let tx, ty;
            if (isStrikeTarget) {
                tx = (Math.random() - 0.5) * 0.9;
                ty = 0.55 + Math.random() * 0.8;
            } else {
                tx = (Math.random() - 0.5) * 1.5;
                ty = 0.3 + Math.random() * 1.3;
            }

            let speed = pType.speedMin + Math.random() * (pType.speedMax - pType.speedMin);
            
            const startZ = -16.5;
            const startY = 1.3;
            const frames = (1.8 - startZ) / speed;
            const displayKm = Math.round(speed * DISPLAY_KM_SCALE); // 表示する球速だけを上げる（実際のボールの速さは変わらない）
            
            let currentPitchText = `${currentPitchType} ${displayKm} km/h`;
            document.getElementById('pitchInfoDisplay').innerText = "";

            // ストレートは最初から狙いのコース・高さで放たれ、x/yが変化しない
            // さらにストレートは、前半は水平に進み、終盤で上へホップして狙いの高さに届く
            // フォークは、本塁の手前までほぼ真っ直ぐ来て、直前で急に沈んで狙いの高さに届く
            let curveStartZ = null;
            let curveY = pType.curveY;
            let hopRise = 0;
            let dropAmount = 0;
            let flatFlight = false; // true の間は縦方向の初速0で、curveStartZ を過ぎてから曲がりが乗る
            if (pType.straight) {
                hopRise = Math.min(HOP_RISE, Math.max(0, ty - 0.2)); // 低めのコースは地面にめり込まないよう浮き上がり量を抑える
                curveStartZ = startZ + (1.8 - startZ) * HOP_START;
                const hopFrames = (1.8 - curveStartZ) / speed;
                curveY = (2 * hopRise) / (hopFrames * hopFrames);
                flatFlight = true;
            } else if (pType.lateBreak) {
                dropAmount = Math.max(0, startY - ty) * FORK_DROP_SCALE; // 終盤で一気に沈む量（落差）
                curveStartZ = startZ + (1.8 - startZ) * FORK_BREAK_START;
                const breakFrames = (1.8 - curveStartZ) / speed;
                curveY = -(2 * dropAmount) / (breakFrames * breakFrames);
                flatFlight = true;
            }

            const releaseX = pType.straight ? tx : (pType.lateBreak ? tx * (1 - FORK_SIDE_SCALE) : 0); // フォークは放つ位置を狙いのコース寄りにして、横に動く幅を小さくする
            // フォークは、狙いの高さ(ty)から dropAmount ぶんだけ高い位置から水平に放ち、終盤の急な沈みでちょうど ty に届く
            let releaseY = pType.straight ? ty - hopRise : (pType.lateBreak ? ty + dropAmount : startY);
            if (pType.noRise) {
                // 上向きの初速が出ないよう、狙いが高いときは放つ位置を高くして、最初から下向き（または水平）に進ませる
                releaseY = Math.max(startY, ty + 0.5 * Math.abs(pType.curveY) * frames * frames);
            }

            let vx0 = ((tx - releaseX) / frames) - 0.5 * pType.curveX * frames;
            let vy0 = flatFlight ? 0 : ((ty - releaseY) / frames) - 0.5 * pType.curveY * frames;

            pendingPitch = {
                vel: new THREE.Vector3(vx0, vy0, speed),
                pos: new THREE.Vector3(releaseX, releaseY, startZ),
                curveX: pType.curveX,
                curveY: curveY,
                curveStartZ: curveStartZ,
                displayText: currentPitchText
            };
            
            ball.position.set(0, -10, startZ);
            updateUI();

            // ピッチャーとバッターが画面に映った状態で1秒間待ってから、
            // 実際の投球モーション（windup）を開始する。
            gameState = 'pre_pitch_wait';
            updateStealButtons();
            setTimeout(() => {
                if (gameState === 'pre_pitch_wait') {
                    gameState = 'windup';
                    windupProgress = 0;
                    updateStealButtons();
                }
            }, 1000);
        }

        function addOut(msg) {
            outs++; 
            if (outs >= 3) { 
                showTxt(msg + " チェンジ", "miss"); 
                outs = 0; 
                if (!isTeamA) inning++; 
                isTeamA = !isTeamA; 
                runners = [false, false, false]; 
            } else { 
                showTxt(msg, "miss"); 
            }
            balls = 0; strikes = 0; 
            updateUI(); 
            setTimeout(pitchBall, 3000);
        }

        // フォースプレイ（塁を踏めばアウト）かどうか。false ならタッチが必要
        function isForcePlay(runner, targetSeg) {
            if (!runner) return false;
            if (runner === batterRunner) {
                for (let b = 0; b < targetSeg - 1; b++) if (!runners[b]) return false;
                return true;
            }
            if (targetSeg !== runner.startSegment + 1) return false;
            for (let b = 0; b < runner.startSegment - 1; b++) if (!runners[b]) return false;
            return true;
        }

        // --- 走者ごとに別々に判定するためのプレー管理 ---
        let buntPlayActive = false;   // いまの打球がバントか（内野守備の動き出しを速くするために使う）
        let fielderReactionLeft = 0;  // 打球を打ってから、守備が動き出すまでの残りフレーム数
        let contactRunPlay = false;  // 2アウトでフライ・ライナーが上がったプレー（走者はハーフウェイに出ず、打球と同時に走る）
        let tagUpPlayActive = false; // タッチアップに対する送球プレー中（true の間はフォースプレイ扱いにしない）
        let playOuts = 0;        // このプレーで取ったアウトの数
        let playOutMsg = "";     // 最後に取ったアウトの表示

        // まだ判定を受けていない走者の中から、次に送球で狙う走者を選ぶ（フォース優先→先の塁を狙う走者）
        // バントのとき、先の塁（先頭走者）を狙っても間に合わないなら、確実に取れる塁へ投げる（無理に先の塁へ投げて、打者を生かす「野選」を減らす）
        const BUNT_THROW_SAFETY_FRAMES = 8;   // 送球が走者の到達より、これだけ早く着く見込みがあるときだけ「アウトにできる」と見なす（フレーム。大きいほど慎重に1塁を選ぶ）
        const BUNT_TAG_PENALTY_FRAMES = 15;   // フォースでない走者はタッチが必要なので、そのぶん余裕を多く見る（フレーム）
        function pickThrowTarget(fromPos) {
            const list = activeRunners.filter(r => r.isActive && !r.judged && r.currentSegment < r.targetSegment && r.currentSegment < 4);
            if (list.length === 0) return null;
            const forced = list.filter(r => isForcePlay(r, r.targetSegment));
            const pool = forced.length > 0 ? forced : list;
            pool.sort((a, b) => b.targetSegment - a.targetSegment);
            if (!buntPlayActive || !fromPos || pool.length <= 1) {
                return { runner: pool[0], seg: pool[0].targetSegment };
            }
            // 各候補について「送球が着くまで」と「走者が塁に着くまで」を比べ、余裕（margin）を出す
            const cands = pool.map(r => {
                const seg = r.targetSegment;
                const bp = BASEMAN_STAND[Math.max(1, Math.min(4, seg)) - 1];
                const dist = Math.hypot(bp.x - fromPos.x, bp.z - fromPos.z);
                const throwFrames = Math.min(150, Math.max(55, Math.round(dist * 2.4) + 12));
                const runFrames = Math.max(0, seg - r.locationValue) / Math.max(1e-6, r.speed);
                const tagCost = isForcePlay(r, seg) ? 0 : BUNT_TAG_PENALTY_FRAMES;
                return { runner: r, seg: seg, margin: runFrames - throwFrames - tagCost };
            });
            // アウトにできる見込みがある候補のうち、いちばん先の塁を狙う
            const ok = cands.filter(c => c.margin >= BUNT_THROW_SAFETY_FRAMES);
            if (ok.length > 0) {
                ok.sort((a, b) => b.seg - a.seg);
                return { runner: ok[0].runner, seg: ok[0].seg };
            }
            // どれも厳しいときは、いちばん余裕がある（＝間に合う可能性が高い）塁へ投げる
            cands.sort((a, b) => b.margin - a.margin);
            return { runner: cands[0].runner, seg: cands[0].seg };
        }

        // fromPos の位置から、targetSeg の塁に立つ野手へ送球する（野手はこのとき設置される）
        function startThrow(fromPos, throwRunner, throwTargetSegment, isOutfieldThrow) {
            const idx = Math.max(1, Math.min(4, throwTargetSegment)) - 1;
            const targetBaseman = basemen[idx];
            if (idx === 3) buntCatcher.visible = false; // 本塁の送球の受け手は塁上の捕手が担当
            targetBaseman.group.position.copy(BASEMAN_STAND[idx]);
            targetBaseman.leftHand.position.set(-0.35, 0.4, 0.15);
            targetBaseman.rightHand.position.set(0.35, 0.4, 0.15);
            targetBaseman.group.visible = true;
            targetBaseman.group.lookAt(fromPos.x, 0, fromPos.z);

            const targetPos = new THREE.Vector3(targetBaseman.group.position.x, 1.0, targetBaseman.group.position.z);
            const distToTarget = Math.hypot(targetPos.x - fromPos.x, targetPos.z - fromPos.z);
            // 野手の捕球・送球動作に現実的なもたつき時間・到達時間を確保（外野からの送球は少し肩が弱い）
            const armFactor = isOutfieldThrow ? OUTFIELD_THROW_FACTOR : 1.0;
            const throwFrames = Math.min(150, Math.max(55, Math.round(distToTarget * 2.4 * armFactor) + 12));

            gameState = 'throwing_to_base';
            playResult = "THROWING";

            ball.position.set(fromPos.x, 1.2, fromPos.z);
            ballVel.set(
                (targetPos.x - ball.position.x) / throwFrames,
                (targetPos.y - ball.position.y) / throwFrames,
                (targetPos.z - ball.position.z) / throwFrames
            );

            currentThrow = {
                targetSegment: throwTargetSegment,
                runner: throwRunner,
                framesLeft: throwFrames,
                targetPos: targetPos,
                baseman: targetBaseman,
                forced: !tagUpPlayActive && isForcePlay(throwRunner, throwTargetSegment), // タッチアップは常にタッチプレー
                tagFrames: 0,
                tagHold: 0
            };
        }

        // 1人ぶんのアウト/セーフを確定する。まだ走っている別の走者がいれば、その走者を別に判定する
        // （isSafe: セーフ / tagged: タッチで取ったアウトか）
        function resolveThrowPlay(runner, targetSeg, isSafe, tagged) {
            if (currentThrow && currentThrow.baseman) {
                currentThrow.baseman.rightHand.position.set(0.35, 0.4, 0.15);
            }
            if (runner) runner.judged = true;

            if (isSafe) {
                // すでにその塁を過ぎている走者を、塁まで引き戻さない（2塁まで進んでいたのに1塁扱いになるのを防ぐ）
                if (runner && runner.isActive && runner.locationValue <= targetSeg + 1e-6) {
                    runner.currentSegment = targetSeg;
                    runner.progress = 0;
                }
            } else {
                if (runner) runner.reset();
                playOuts++;
                if (runner === batterRunner) {
                    playOutMsg = (tagged || targetSeg === 1) ? getOutMsg(targetSeg) : "フォースアウト!";
                } else {
                    playOutMsg = tagged ? "タッチアウト!" : "フォースアウト!";
                }
            }

            // 3アウトでなければ、まだ塁に着いていない別の走者へ続けて送球（他の走者を元の塁へ戻したりしない）
            if (outs + playOuts < 3 && currentThrow) {
                const next = pickThrowTarget(currentThrow.baseman.group.position);
                if (next) {
                    startThrow(currentThrow.baseman.group.position, next.runner, next.seg);
                    return;
                }
            }
            if (tagUpPlayActive) finishTagUpPlay(); else finishPlay();
        }

        // タッチアップに対する送球プレーの結果表示（フライアウトの1アウトは捕球時に記録済み）
        function finishTagUpPlay() {
            tagUpPlayActive = false;
            const nOut = playOuts;
            const outMsg = playOutMsg;
            playOuts = 0;
            playOutMsg = "";
            hitRunPlan = null;
            gameState = 'waiting';

            // 走者の最終位置（まだ走っている走者は、向かっている先の塁）を塁の状況に反映
            const nextR = [false, false, false];
            activeRunners.forEach(r => {
                if (!r.isActive || r === batterRunner) return;
                const seg = r.tagUpAfterReturn ? Math.min(4, r.startSegment + 1) : Math.max(r.currentSegment, r.targetSegment);
                if (seg >= 1 && seg <= 3) nextR[seg - 1] = true;
            });
            runners = nextR;
            updateVisualRunners();

            balls = 0; strikes = 0;
            if (outs + nOut >= 3) {
                outs += nOut - 1;
                addOut("タッチアップ失敗! " + outMsg);
            } else if (nOut > 0) {
                outs += nOut;
                showTxt("タッチアップ失敗! " + outMsg, "miss");
                updateUI();
                setTimeout(pitchBall, 2500);
            } else {
                showTxt("タッチアップ成功! セーフ!", "good");
                updateUI();
                setTimeout(pitchBall, 2200);
            }
        }

        // すべての走者の判定が終わったあとの結果表示
        function finishPlay() {
            endRunPlayActive = false;
            if (stealAnimation) {
                stealAnimation.finished = true;
                stealAnimation = null;
            }
            stealThrow = null;
            syncRunnersArrayFrom3D();
            const batterBase = batterRunner ? batterRunner.currentSegment : 0;
            const nOut = playOuts;
            const outText = nOut >= 3 ? "トリプルプレー!" : nOut === 2 ? "ダブルプレー!" : playOutMsg;
            playOuts = 0;
            playOutMsg = "";
            hitRunPlan = null;
            gameState = 'waiting';

            if (nOut === 0) {
                if (batterBase === 1) safe("内野安打・シングルヒット!", undefined, "good");
                else if (batterBase === 2) safe("ツーベースヒット!!", undefined, "good");
                else if (batterBase === 3) safe("スリーベースヒット!!!", undefined, "good");
                else if (batterBase >= 4) safe("ランニングホームラン!!!", undefined, "hr");
                else safe("ヒット!", undefined, "good");
            } else if (outs + nOut >= 3) {
                outs += nOut - 1;
                addOut(outText);
            } else if (batterBase >= 1) {
                outs += nOut;
                let hitMsg = "ヒット!";
                if (batterBase === 2) hitMsg = "ツーベース!!";
                else if (batterBase === 3) hitMsg = "スリーベース!!!";
                else if (batterBase >= 4) hitMsg = "ランニングホームラン!!!";
                safe(`${hitMsg} (走者アウト)`, undefined, "good");
            } else {
                outs += nOut - 1;
                addOut(outText);
            }
        }

        function safe(msg, bases, cls) { 
            if (bases !== undefined && bases > 0) {
                if (batterRunner) batterRunner.targetSegment = bases;
                activeRunners.forEach(r => {
                    if (r.isActive && r !== batterRunner) {
                        r.targetSegment = Math.min(4, r.currentSegment + bases);
                    }
                });
                let runsScored = moveRunners(bases); 
                showTxt(msg + (runsScored ? ` +${runsScored}` : ""), cls); 
            } else {
                let runsScored = syncRunnersArrayFrom3D();
                showTxt(msg + (runsScored ? ` +${runsScored}` : ""), cls); 
            }
            balls = 0; strikes = 0; 
            updateUI(); 
            setTimeout(pitchBall, 3700 + (bases ? bases * 800 : 1000)); 
        }

        // --- 10. メインフレームアニメーション ---
        function animate() {
            requestAnimationFrame(animate);

            updateHitParticles();

            if (gameState === 'windup') {
                windupProgress += 0.04;
                if (windupProgress < 1.0) {
                    pitcherObj.group.position.y = Math.sin(windupProgress * Math.PI) * 0.35;
                } else if (windupProgress < 1.4) {
                    let p = (windupProgress - 1.0) * 2.5;
                    pitcherObj.group.rotation.y = (Math.PI / 4) * (1 - p);
                    pitcherObj.rightHand.position.set(0.35, 0.9 - p * 0.5, p * 0.3);
                } else {
                    gameState = 'pitching';
                    updateStealButtons();
                    if (pendingSwingInput && !isSwinging) {
                        pendingSwingInput = false;
                        isBunting = buntMode;
                        isSwinging = true;
                        swingProgress = 0;
                        swungOnCurrentPitch = true;
                        sound.playSwing();
                    }
                    pitcherObj.group.position.y = 0;
                    pitcherObj.group.rotation.y = 0;
                    pitcherObj.rightHand.position.set(0.35, 0.4, 0.15);
                    ball.position.copy(pendingPitch.pos);
                    ballVel.copy(pendingPitch.vel);

                    // ピッチャーが投げ始めた瞬間に、通常の走塁と同じ速度で盗塁開始。
                    if (stealAnimation && !stealAnimation.started && !stealAnimation.finished) {
                        const sa = stealAnimation;
                        const r = sa.runner;
                        sa.started = true;
                        r.startSegment = sa.fromBase;
                        r.currentSegment = sa.fromBase;
                        r.targetSegment = sa.toBase;
                        r.progress = 0;
                        r.speed = RUNNER_SPEED * STEAL_RUNNER_SPEED_SCALE;   // 盗塁の走りは少し遅め
                        r.judged = false;
                        r.obj.group.visible = true;
                        document.getElementById('timingInfo').innerText = `盗塁！ 捕手が${stealBaseName(sa.toBase)}へ送球！`;
                        document.getElementById('timingInfo').className = 'good';
                        document.getElementById('timingInfo').style.opacity = 1;
                    }

                    // 盗塁ボタン＝エンドラン指示。投球開始と同時に打者もスイングする。
                    if (stealAnimation && stealAnimation.started && stealAnimation.swingWithPitch && !isSwinging) {
                        isBunting = buntMode;
                        isSwinging = true;
                        swingProgress = 0;
                        swungOnCurrentPitch = true;
                        sound.playSwing();
                        document.getElementById('timingInfo').innerText = `エンドラン！ ${stealBaseName(stealAnimation.toBase)}へ走る！`;
                    }

                }
            } 
            else if (gameState === 'homerun') {
                ball.position.add(ballVel.clone().multiplyScalar(0.4));
                ballVel.multiplyScalar(0.96);

                let camTargetX = Math.max(-15, Math.min(15, ball.position.x * 0.3));
                let camTarget = new THREE.Vector3(camTargetX, 5.5, 11.0);
                camera.position.lerp(camTarget, 0.04);
                camera.lookAt(0, 1.2, -10);
            }
            else {
                if (gameState === 'pitching') {
                    ballVel.x += pendingPitch.curveX;
                    if (pendingPitch.curveStartZ === null || ball.position.z >= pendingPitch.curveStartZ) {
                        ballVel.y += pendingPitch.curveY;
                    }
                    ball.position.add(ballVel);
                } else if (gameState !== 'steal_throwing') {
                    ball.position.add(ballVel);
                }
            }

            if (gameState === 'pitching') {
                ballMarker.visible = true;
                ballMarker.position.x = ball.position.x;
                ballMarker.position.y = ball.position.y;

                if (ball.position.z > 1.8 && !pitchEval) { 
                    pitchEval = true; 
                    wasStrike = Math.abs(ball.position.x) <= 0.6 && ball.position.y >= 0.4 && ball.position.y <= 1.5; 
                }
                // 振った球は、ボールが捕手のミットに届く前（本塁を少し過ぎた時点）で判定する。見送った球は従来どおり捕手まで届いてから判定
                if (ball.position.z > (swungOnCurrentPitch ? SWING_MISS_JUDGE_Z : 4.5)) { 
                    gameState = 'waiting'; 
                    ballMarker.visible = false;
                    sound.playCatch();

                    // エンドランで打者が空振りした場合だけ、捕手が盗塁先へ送球する。
                    // 打者がボールに当てた場合は通常の打球処理へ進み、盗塁送球はしない。
                    // 空振り時は送球が塁に届いた瞬間に、あらかじめ決めた成功率でセーフ/アウトを確定する。
                    if (stealAnimation && stealAnimation.started && !stealAnimation.finished && !stealAnimation.madeContact && !stealThrow) {
                        const sa = stealAnimation;
                        const catcher = basemen[3];
                        const targetBaseman = basemen[Math.max(0, Math.min(3, sa.toBase - 1))];
                        catcher.group.position.copy(BASEMAN_STAND[3]);
                        catcher.group.visible = true;
                        if (sa.toBase < 4) catcher.group.lookAt(getPathCoord(sa.toBase).x, 0, getPathCoord(sa.toBase).z);
                        else catcher.group.lookAt(0, 0, -16.5);
                        targetBaseman.group.position.copy(BASEMAN_STAND[sa.toBase - 1]);
                        targetBaseman.group.visible = true;
                        if (sa.toBase < 4) targetBaseman.group.lookAt(BASEMAN_STAND[3].x, 0, BASEMAN_STAND[3].z);

                        const from = new THREE.Vector3(BASEMAN_STAND[3].x, 1.05, BASEMAN_STAND[3].z);
                        const target = new THREE.Vector3(targetBaseman.group.position.x, 1.0, targetBaseman.group.position.z);
                        const dist = from.distanceTo(target);
                        // 成功率はボタンを押した時点で決まっている（sa.success）。その結果が「送球と走者の到着タイミング」の勝負として自然に出るよう、
                        // 送球にかかる時間を調整する（セーフ＝走者が先に着く／アウト＝送球が先に着く）。
                        const sr = sa.runner;
                        const remFrames = Math.max(0, (sa.toBase - sr.locationValue) / Math.max(1e-6, sr.speed));   // 走者が塁に着くまでの残りフレーム
                        const margin = STEAL_TIMING_MARGIN_MIN + Math.random() * (STEAL_TIMING_MARGIN_MAX - STEAL_TIMING_MARGIN_MIN);
                        let throwFrames = Math.max(24, Math.round(dist * 2.0));
                        if (sa.success) {
                            throwFrames = Math.max(throwFrames, Math.round(remFrames + margin));   // 走者のほうが先に着く
                        } else {
                            const maxThrow = Math.round(remFrames - margin);
                            if (maxThrow < STEAL_THROW_MIN_FRAMES) {
                                // 走者がすでに塁の近くまで来ていて、送球が先に着く余地がないときは、走者がもたついて遅れたことにする
                                throwFrames = STEAL_THROW_MIN_FRAMES;
                                const needRem = STEAL_THROW_MIN_FRAMES + margin;
                                const remDist = Math.max(0, sa.toBase - sr.locationValue);
                                if (remDist > 1e-6) sr.speed = Math.min(sr.speed, remDist / needRem);
                            } else {
                                throwFrames = Math.min(throwFrames, maxThrow);   // 送球のほうが先に着く
                            }
                        }
                        ball.position.copy(from);
                        ballVel.set((target.x - from.x) / throwFrames, (target.y - from.y) / throwFrames, (target.z - from.z) / throwFrames);
                        stealThrow = { runner: sa.runner, targetSegment: sa.toBase, targetPos: target, framesLeft: throwFrames, catcher, targetBaseman };
                        gameState = 'steal_throwing';
                        document.getElementById('timingInfo').innerText = `捕手送球！ → ${stealBaseName(sa.toBase)}`;
                        document.getElementById('timingInfo').className = 'good';
                        document.getElementById('timingInfo').style.opacity = 1;
                    } else {
                        if (pendingPitch && pendingPitch.displayText) {
                            document.getElementById('pitchInfoDisplay').innerText = pendingPitch.displayText;
                        }

                    const isStrikeCall = wasStrike || swungOnCurrentPitch;

                    if (isStrikeCall) { 
                        strikes++; 
                        if (strikes >= 3) addOut("三振!"); 
                        else { 
                            let msg = (swungOnCurrentPitch && !wasStrike) ? "空振り!" : "ストライク";
                            showTxt(msg, "miss"); 
                            updateUI(); 
                            setTimeout(pitchBall, 2500); 
                        } 
                    } else { 
                        balls++; 
                        if (balls >= 4) { 
                            playerGroup.visible = false;
                            let walkBatter = activeRunners.find(r => !r.isActive);
                            if (walkBatter) walkBatter.spawn(0, 1);
                            
                            let has1 = runners[0], has2 = runners[1], has3 = runners[2];
                            activeRunners.forEach(r => {
                                if (r.isActive && r !== walkBatter) {
                                    if (r.currentSegment === 1 && has1) r.targetSegment = 2;
                                    else if (r.currentSegment === 2 && has1 && has2) r.targetSegment = 3;
                                    else if (r.currentSegment === 3 && has1 && has2 && has3) r.targetSegment = 4;
                                }
                            });

                            let r = advanceForWalk();
                            showTxt("フォアボール" + (r ? ` +${r}` : ""), "good"); 
                            balls = 0; strikes = 0; updateUI(); setTimeout(pitchBall, 4000); 
                        } else { 
                            showTxt("ボール", "good"); updateUI(); setTimeout(pitchBall, 2500); 
                        } 
                    }
                    }
                }
            }

            activeRunners.forEach(r => r.update());

            // 盗塁は走者が先に着いても、その場では判定しない。
            // 捕手の送球が向こうの塁に到達した瞬間に、セーフ/アウトを確定する。
            if (gameState === 'steal_throwing' && stealThrow) {
                const st = stealThrow;
                const sa = stealAnimation;
                ball.position.add(ballVel);
                st.framesLeft--;

                // カメラは捕手が投げたボールを追いかける（ボールの少し後ろ・上から見る）
                camera.position.lerp(new THREE.Vector3(ball.position.x * STEAL_CAM_X_FOLLOW, STEAL_CAM_HEIGHT, ball.position.z + STEAL_CAM_BEHIND), STEAL_CAM_LERP);
                camera.lookAt(ball.position.x, Math.max(0.8, ball.position.y), ball.position.z);

                if (st.framesLeft <= 0 || ball.position.distanceTo(st.targetPos) < 0.55) {
                    ball.position.copy(st.targetPos);
                    ballVel.set(0, 0, 0);
                    sound.playCatch();

                    if (sa && !sa.finished) {
                        const r = sa.runner;
                        // 送球が着いた瞬間に、走者がすでに塁へ着いていればセーフ、まだならアウト（あらかじめ決めた成否に合わせて送球時間を調整済み）
                        const success = r.locationValue >= sa.toBase - 1e-6;
                        sa.finished = true;
                        stealAnimation = null;
                        stealThrow = null;

                        r.startSegment = sa.toBase;
                        r.currentSegment = sa.toBase;
                        r.targetSegment = sa.toBase;
                        r.progress = 0;
                        r.speed = RUNNER_SPEED;
                        r.obj.group.position.copy(getPathCoord(sa.toBase));
                        runners[sa.fromBase - 1] = false;

                        if (success) {
                            r.judged = false;
                            if (sa.toBase <= 3) runners[sa.toBase - 1] = true;
                            else { r.currentSegment = 4; r.targetSegment = 4; } // 本塁は得点（走者の更新処理で加点される）
                            document.getElementById('timingInfo').innerText = `盗塁成功！ ${stealBaseName(sa.fromBase)}→${stealBaseName(sa.toBase)} セーフ！`;
                            document.getElementById('timingInfo').className = 'good';
                        } else {
                            r.judged = true;
                            r.isActive = false;
                            r.obj.group.visible = false;
                            document.getElementById('timingInfo').innerText = `盗塁失敗！ ${stealBaseName(sa.fromBase)}→${stealBaseName(sa.toBase)} アウト！`;
                            document.getElementById('timingInfo').className = 'miss';
                            addOut(`盗塁失敗！ ${sa.fromBase}塁走者アウト`);
                        }
                        document.getElementById('timingInfo').style.opacity = 1;
                        st.catcher.group.visible = false;
                        st.targetBaseman.group.visible = false;
                        updateUI();
                        updateStealButtons();

                        if (outs < 3) setTimeout(pitchBall, 2000);
                    }
                    gameState = 'waiting';
                }
            }

            if (gameState === 'throwing_to_base') {
                if (currentThrow) {
                    let targetPos = currentThrow.targetPos;
                    let camTargetPos = new THREE.Vector3().copy(targetPos).add(new THREE.Vector3(0, 4.0, 7.5));
                    
                    camera.position.lerp(camTargetPos, 0.08); 
                    camera.lookAt(targetPos);

                    currentThrow.framesLeft--;
                    
                    if (currentThrow.framesLeft <= 0 || ball.position.distanceTo(currentThrow.targetPos) < 0.8) {
                        let targetSeg = currentThrow.targetSegment;
                        let runner = currentThrow.runner;
                        sound.playCatch();

                        ball.position.copy(currentThrow.targetPos);
                        ballVel.set(0, 0, 0);
                        
                        // 送球が塁上の野手に届いた瞬間：ランナーが先に塁へ着いていればセーフ
                        const runnerReached = !(runner && runner.isActive) || runner.locationValue >= targetSeg - SAFE_MARGIN - 1e-6;
                        
                        if (runnerReached) {
                            resolveThrowPlay(runner, targetSeg, true, false);
                        } else if (currentThrow.forced) {
                            // フォースプレイ：塁を踏んでいればタッチ不要でアウト
                            resolveThrowPlay(runner, targetSeg, false, false);
                        } else {
                            // タッチプレイ：野手がボールを持ったままランナーにタッチしに行く
                            gameState = 'tagging';
                        }
                    }
                }
            }

            if (gameState === 'tagging' && currentThrow) {
                const t = currentThrow;
                const bm = t.baseman.group;
                const runner = t.runner;
                const seg = t.targetSegment;

                // カメラは塁上の野手を追う
                camera.position.lerp(new THREE.Vector3(bm.position.x, 4.0, bm.position.z + 7.5), 0.08);
                camera.lookAt(bm.position.x, 1.0, bm.position.z);

                // ボールは野手のグラブの中
                const glovePos = new THREE.Vector3();
                t.baseman.rightHand.getWorldPosition(glovePos);
                ball.position.copy(glovePos);
                ballVel.set(0, 0, 0);

                t.tagFrames++;

                if (!runner || !runner.isActive) {
                    // ランナーがすでにホームインなどで走塁を終えた
                    resolveThrowPlay(runner, seg, true, false);
                } else if (t.tagHold > 0) {
                    // タッチの瞬間（ランナーは止まる）
                    t.tagHold--;
                    if (t.tagHold === 0) resolveThrowPlay(runner, seg, false, true);
                } else if (runner.locationValue >= seg - SAFE_MARGIN - 1e-6) {
                    // タッチされる前にランナーが塁へ到達
                    resolveThrowPlay(runner, seg, true, false);
                } else {
                    const rp = runner.obj.group.position;
                    const ddx = rp.x - bm.position.x;
                    const ddz = rp.z - bm.position.z;
                    const dist = Math.hypot(ddx, ddz);
                    bm.lookAt(rp.x, 0, rp.z);

                    if (dist <= TAG_RADIUS) {
                        // タッチ！ グラブを突き出す
                        t.tagHold = TAG_HOLD_FRAMES;
                        runner.speed = 0;
                        t.baseman.rightHand.position.set(0.2, 0.6, 0.85);
                        sound.playCatch();
                    } else {
                        const step = Math.min(TAG_FIELDER_SPEED, dist - TAG_RADIUS * 0.5);
                        bm.position.x += (ddx / dist) * step;
                        bm.position.z += (ddz / dist) * step;
                    }
                }

                // 念のための安全弁（長引きすぎたら到達状況で判定）
                if (t.tagFrames > 900 && t.tagHold === 0 && gameState === 'tagging') {
                    const reached = !runner || !runner.isActive || runner.locationValue >= seg - SAFE_MARGIN - 1e-6;
                    resolveThrowPlay(runner, seg, reached, !reached);
                }
            }

            if (gameState === 'running') {
                ballVel.y -= 0.0035; 
                let justBounced = false; 

                if (ball.position.y < 0.1) { 
                    ball.position.y = 0.1; 
                    ballVel.y *= -GROUND_BOUNCE_RESTITUTION; 
                    ballVel.x *= GROUND_BOUNCE_DAMPING; 
                    ballVel.z *= GROUND_BOUNCE_DAMPING; 

                    if (!isFairConfirmed) {
                        let isBoundInside = ball.position.z <= 2.0 && Math.abs(ball.position.x) <= Math.abs(ball.position.z - 2.0);
                        if (isBoundInside) isFairConfirmed = true;
                    }
                    if (!hasBounced) justBounced = true;
                    hasBounced = true; 
                }
                
                // ファール確定後は、ボールが自然に落下・バウンドして転がりきるまで物理演算だけを続ける
                if (foulSettling) {
                    // 特別な打ち切りはせず、フェアゾーンの打球と同じ物理（重力・バウンド・摩擦）でそのまま転がって自然に止まるのを待つ
                    foulSettleFrames++;
                    const speed2D = Math.hypot(ballVel.x, ballVel.z);
                    const settled = ball.position.y <= 0.11 && speed2D < 0.015;
                    if (settled || foulSettleFrames > 240) { // 240フレームは念のための保険（通常はこれより前に自然に止まる）
                        foulSettling = false;
                        gameState = 'waiting';
                        setTimeout(pitchBall, 1200);
                    }
                    return;
                }

                let distToHome = Math.hypot(ball.position.x, ball.position.z - 1.8);
                let isFairAngle = Math.abs(ball.position.x) <= Math.abs(ball.position.z - 1.8);

                if (distToHome >= fenceRadius - 1.0 && distToHome <= fenceRadius + 1.5 && ball.position.y < 10.0) {
                    let nx = ball.position.x / distToHome;
                    let nz = (ball.position.z - 1.8) / distToHome;
                    let dot = ballVel.x * nx + ballVel.z * nz;
                    if (dot > 0) { 
                        ballVel.x -= 1.08 * dot * nx; 
                        ballVel.z -= 1.08 * dot * nz; 
                        ballVel.x *= 0.2; 
                        ballVel.y *= 0.3;
                        if (!hasBounced) justBounced = true;
                        hasBounced = true; 
                        if (isFairAngle) isFairConfirmed = true; 
                    }
                }

                if (playResult === "") {
                    if (hasBounced && !isFairAngle && !isFairConfirmed) {
                        callFoul("ファウル");
                        // ゲーム状態は 'running' のまま維持し、ボールが自然に転がって止まるまで物理演算を続ける
                    }

                    if (!isFairAngle && (distToHome > 40 || Math.abs(ball.position.x) > 30 || ball.position.z > 10.0)) {
                        let canCatchFoul = fielders.some(f => ball.position.distanceTo(f.position) < 7.0);
                        if (!canCatchFoul) {
                            callFoul("ファウル");
                        }
                    }
                }

                if (distToHome >= fenceRadius && playResult === "") {
                    if (isFairAngle) {
                        if (!hasBounced) {
                            playResult = "HOMERUN";
                            gameState = 'homerun';
                            triggerHomerun();
                            return;
                        }
                        // フェンスに達した時点ですでにバウンド（壁への直撃を含む）していた場合は、
                        // エンタイトルツーベースにはせず、そのまま生きた打球として扱う（三塁打以下になりうる）
                    } else {
                        playResult = "FOUL";
                        gameState = 'waiting';
                        returnRunnersToBase();
                        if (stealAnimation) {
                            stealAnimation.finished = true;
                            stealAnimation = null;
                        }
                        if (batterRunner) batterRunner.reset();
                        if (strikes < 2) strikes++;
                        showTxt("ファウル (スタンドイン)", "miss");
                        endRunPlayActive = false;
                        updateUI();
                        setTimeout(pitchBall, 1700);
                        return;
                    }
                }

                if ((ball.position.z < -100 || Math.abs(ball.position.x) > 85) && playResult === "") {
                    if (isFairAngle && !hasBounced) {
                        playResult = "HOMERUN";
                        gameState = 'homerun';
                        triggerHomerun();
                        return;
                    } else {
                        playResult = "FOUL";
                        gameState = 'waiting';
                        returnRunnersToBase();
                        if (stealAnimation) {
                            stealAnimation.finished = true;
                            stealAnimation = null;
                        }
                        if (batterRunner) batterRunner.reset();
                        if (strikes < 2) strikes++;
                        showTxt("ファウル", "miss");
                        endRunPlayActive = false;
                        updateUI();
                        setTimeout(pitchBall, 1700);
                        return;
                    }
                }

                if (justBounced && playResult !== "FOUL") {
                    let hitDist = Math.hypot(ball.position.x, ball.position.z - 1.8);
                    let isOutfield = hitDist > 28;

                    let sortedRunners = activeRunners.filter(r => r.isActive).sort((a, b) => b.startSegment - a.startSegment);
                    let maxAllowedSegment = 4;

                    sortedRunners.forEach(r => {
                        r.holdProgress = null; // バウンドしたらハーフウェイ待機を解除（ここから進塁／帰塁を決める）
                        let desiredTarget = r.startSegment;

                        // エンドラン中の走者は、ゴロでも走りを止めずに進塁する。
                        // 盗塁で設定した行き先をそのまま打球処理にも引き継ぐ。
                        if (endRunPlayActive && stealAnimation && r === stealAnimation.runner) {
                            desiredTarget = Math.max(r.targetSegment, r.startSegment + 1);
                        } else if (r === batterRunner) {
                            // 打者自身の単打・二塁打・三塁打は、これまでどおり飛距離だけで決める
                            // （走者1人がフルに2〜3塁分走りきる時間は、送球の見積もりよりどうしても長くなりがちで、
                            //   送球との時間比較を入れると二塁打がほとんど成立しなくなってしまうため、打者にはこの安全確認を適用しない）
                            desiredTarget = hitDist > 68 ? 3 : (hitDist > 18 ? 2 : 1); // 壁際に達したときの飛距離はだいたい67〜68.5に収まるため、これがほぼ実質的な上限
                        } else {
                            let isForced = false;
                            if (r.startSegment === 1) isForced = true;
                            if (r.startSegment === 2 && runners[0]) isForced = true;
                            if (r.startSegment === 3 && runners[0] && runners[1]) isForced = true;

                            if (hitDist > RUNNER_GO_DIST) {
                                // 深い外野ヒット（飛距離58超）では2つ先の塁も狙うが、送球で刺されそうなら1つ先にとどめる
                                let candidate = r.startSegment + (hitDist > RUNNER_GO_TWO_DIST ? 2 : 1); // 深めの打球では少し積極的に次の塁も狙う
                                if (candidate - r.startSegment >= 2) {
                                    const runnerFrames = (candidate - r.locationValue) / RUNNER_SPEED; // ハーフウェイから出ている分も考慮
                                    const throwFrames = estimateThrowFrames(ball.position, candidate, isOutfield);
                                    if (runnerFrames + RUNNER_ADVANCE_MARGIN >= throwFrames) {
                                        candidate = r.startSegment + 1; // 危なければ1つ先の塁にとどめる
                                    }
                                }
                                desiredTarget = candidate;
                            } else {
                                if (isForced) {
                                    desiredTarget = r.startSegment + 1;
                                } else {
                                    // フォース対象でない内野打球・浅い打球では無理せず元の塁にとどまる
                                    desiredTarget = r.startSegment;
                                }
                            }
                        }
                        
                        // 2アウトで走り出していた走者は、打球が落ちても最低1つ先の塁までは走る（途中で引き返さない）
                        if (contactRunPlay && r !== batterRunner) desiredTarget = Math.max(desiredTarget, r.startSegment + 1);
                        r.targetSegment = Math.min(desiredTarget, maxAllowedSegment);
                        maxAllowedSegment = r.targetSegment - 1;
                    });
                }

                let targetCamX = ball.position.x * 0.55;
                let targetCamY = Math.max(6.0, ball.position.y * 0.4 + 7.0);
                let targetCamZ = ball.position.z + 16.0;
                
                targetCamX = Math.max(-35, Math.min(35, targetCamX));
                targetCamZ = Math.max(-45, Math.min(25, targetCamZ));
                
                camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.05); 
                
                let ballLookTarget = new THREE.Vector3(
                    ball.position.x, 
                    Math.max(0.5, ball.position.y), 
                    ball.position.z
                );
                camera.lookAt(ballLookTarget);
                
                let caughtByFielder = false;
                let fielderWhoCaught = null;
                
                if (playResult === "") {
                    let isFoul = false;
                    if (!isFairConfirmed) {
                        isFoul = ball.position.z > 2.0 || Math.abs(ball.position.x) > Math.abs(ball.position.z - 2.0);
                    }

                    let predictedX = ball.position.x;
                    let predictedZ = ball.position.z;
                    
                    if (!hasBounced) { 
                        let a = -0.00175; 
                        let b = ballVel.y;
                        let c = ball.position.y - 0.1; 
                        let discriminant = b * b - 4 * a * c;
                        
                        if (discriminant >= 0) {
                            let t1 = (-b + Math.sqrt(discriminant)) / (2 * a);
                            let t2 = (-b - Math.sqrt(discriminant)) / (2 * a);
                            let t = Math.max(t1, t2); 
                            if (t > 0) {
                                predictedX = ball.position.x + ballVel.x * t;
                                predictedZ = ball.position.z + ballVel.z * t;
                            }
                        }
                    } else {
                        predictedX = ball.position.x + ballVel.x * 30;
                        predictedZ = ball.position.z + ballVel.z * 30;
                    }
                    
                    predictedX = Math.max(-55, Math.min(55, predictedX));
                    predictedZ = Math.max(-75, Math.min(20, predictedZ));

                    let closestFielder = null;
                    let minDist = Infinity;
                    fielders.forEach(f => {
                        let dist = Math.hypot(predictedX - f.position.x, predictedZ - f.position.z);
                        if (dist < minDist) { minDist = dist; closestFielder = f; }
                    });

                    if (fielderReactionLeft > 0) fielderReactionLeft--;

                    // 打球に最も早く追いつける野手を選び、その野手を「ボールが来る地点」へ向かわせる。
                    // （正面の打球では、ほとんど動かずに待つ／前に出る。後ろへ下がらない）
                    let interceptFielder = null;
                    let interceptPoint = null;
                    let bestInterceptT = Infinity;
                    fielders.forEach(f => {
                        if (!(isFairConfirmed || hasBounced) && Math.abs(f.position.x) > Math.abs(f.position.z - 2.0) + 5) return;
                        const hit = findFielderIntercept(f);
                        if (hit && hit.t < bestInterceptT) {
                            bestInterceptT = hit.t;
                            interceptFielder = f;
                            interceptPoint = hit;
                        }
                    });
                    const chaser = interceptFielder || closestFielder;

                    fielders.forEach(f => {
                        let targetX = ball.position.x;
                        let targetZ = ball.position.z;
                        let distToBall = Math.hypot(ball.position.x - f.position.x, ball.position.z - f.position.z);
                        
                        if (distToBall > 6.0) { targetX = predictedX; targetZ = predictedZ; }
                        if (f === interceptFielder && interceptPoint) { targetX = interceptPoint.x; targetZ = interceptPoint.z; }

                        let dx = targetX - f.position.x;
                        let dz = targetZ - f.position.z;
                        let d = Math.hypot(dx, dz);
                        
                        let canChaseFoul = isFairConfirmed || hasBounced;
                        let isFielderFoul = false;
                        if (!canChaseFoul) isFielderFoul = Math.abs(f.position.x) > Math.abs(f.position.z - 2.0) + 5;
                        
                        if (f === chaser && fielderReactionFramesLeft(f) <= 0 && d > 0.5 && ball.position.z < 25 && ball.position.z > -85 && !isFielderFoul) { 
                            let fSpeed = fielderChaseSpeed(f);
                            f.position.x += (dx/d) * fSpeed; 
                            f.position.z += (dz/d) * fSpeed; 
                            f.lookAt(targetX, f.position.y, targetZ);
                        }
                        
                        if (Math.hypot(ball.position.x - f.position.x, ball.position.z - f.position.z) < CATCH_RADIUS && ball.position.y < CATCH_MAX_HEIGHT) {
                            caughtByFielder = true;
                            fielderWhoCaught = f;
                        }
                    });

                    if (caughtByFielder) {
                        sound.playCatch();
                        if (!hasBounced) { 
                            gameState = 'waiting';
                            playResult = "OUT"; 

                            // フライ・ライナーを野手が捕ったら、ハーフウェイに出ていた走者はすぐに元の塁へ戻る
                            // ただしエンドランでないとき、フェアの外野フライなら
                            //   ・3塁走者：外野手が捕れば本塁へタッチアップ
                            //   ・2塁走者：右翼手が捕ったときだけ3塁へタッチアップ
                            // （ハーフウェイなので、ダブルプレーにはならない。3アウト目のときはタッチアップしない）
                            const fielderIdx = fielders.indexOf(fielderWhoCaught);
                            const isOutfieldCatch = isOutfielderObj(fielderWhoCaught);
                            const isRightFieldCatch = fielderIdx === 7;
                            let didTagUp = false;

                            activeRunners.forEach(r => {
                                if (!r.isActive) return;
                                if (r !== batterRunner) {
                                    // その場から元の塁へ走って戻る
                                    r.holdProgress = null;
                                    r.speed = RUNNER_SPEED;
                                    r.targetSegment = r.startSegment;
                                    const isEndRunRunner = !!(stealAnimation && r === stealAnimation.runner);
                                    const canTagUp = !isEndRunRunner && !isFoul && isOutfieldCatch && outs < 2;
                                    if (canTagUp && (r.startSegment === 3 || (r.startSegment === 2 && isRightFieldCatch))) {
                                        r.tagUpAfterReturn = true;
                                        r.tagUpRunning = true;
                                        r.speed = RUNNER_SPEED * TAG_UP_SPEED_SCALE;
                                        didTagUp = true;
                                    }
                                } else {
                                    r.currentSegment = r.startSegment;
                                    r.targetSegment = r.startSegment;
                                    r.progress = 0;
                                    r.obj.group.position.copy(getPathCoord(r.startSegment));
                                }
                            });
                            endEndRunState(); // フライアウト（ファウルフライ含む）でエンドランも終了
                            if (didTagUp) {
                                // フライアウトの1アウトを記録（3アウト目のときはタッチアップしないので、ここは必ず3アウト未満）。
                                // 走者の結果は、捕球した野手の送球が塁に届くタイミングで判定する。
                                outs++;
                                balls = 0; strikes = 0;
                                showTxt("フライアウト! タッチアップ!", "miss");
                                updateUI();
                                if (batterRunner) batterRunner.reset();
                                tagUpPlayActive = true;
                                playOuts = 0;
                                playOutMsg = "";
                                // 最も先の塁を狙う走者から送球（3塁走者→本塁、2塁走者→3塁）
                                const tagList = activeRunners.filter(r => r.isActive && r.tagUpAfterReturn).sort((x, y) => y.startSegment - x.startSegment);
                                const leadRunner = tagList[0];
                                startThrow(fielderWhoCaught.position, leadRunner, leadRunner.startSegment + 1, true);
                            } else {
                                // 進塁後の塁の状況を、アニメーションの完了を待たずに反映しておく
                                runners = [false, false, false];
                                activeRunners.forEach(r => {
                                    if (r.isActive) {
                                        // タッチアップする走者は、進んだ先の塁（本塁なら塁上にはいない）で数える
                                        const finalSeg = r.tagUpAfterReturn ? Math.min(4, r.startSegment + 1) : r.targetSegment;
                                        if (finalSeg === 1) runners[0] = true;
                                        else if (finalSeg === 2) runners[1] = true;
                                        else if (finalSeg === 3) runners[2] = true;
                                    }
                                });

                                if (batterRunner) batterRunner.reset();
                                ball.position.set(0, -10, 0);
                                addOut((isFoul ? "ファウルフライ!" : "フライアウト!")); 
                            }
                        } 
                        else { 
                            if (isFoul) { 
                                gameState = 'waiting';
                                playResult = "FOUL"; 
                                returnRunnersToBase();
                                if (batterRunner) batterRunner.reset();
                                if (strikes < 2) strikes++; 
                                showTxt("ファウル", "miss"); updateUI(); endEndRunState(); setTimeout(pitchBall, 1700); 
                            } else {
                                // 走者・打者走者はそれぞれ別に判定する。まず最も先の塁を狙う走者（フォース優先）へ送球
                                playOuts = 0;
                                playOutMsg = "";
                                const first = pickThrowTarget(fielderWhoCaught.position);
                                if (!first) {
                                    // 野手が球を取る前に、全員が目標の塁へ到達済み → 送球は不要。今の到達塁でそのまま結果を出す
                                    // （以前は1塁へ送球してしまい、2塁まで進んだ打者が1塁へ戻されてシングル扱いになっていた）
                                    finishPlay();
                                } else {
                                    const isOutfieldThrow = isOutfielderObj(fielderWhoCaught);
                                    startThrow(fielderWhoCaught.position, first.runner, first.seg, isOutfieldThrow);
                                }
                            }
                        }
                    }
                }
            }

            // バントの構え（屈み＋バット水平）への補間。スワイプ中／バント動作中は1へ、それ以外は0へ戻る
            buntBlend += (((buntStance || isBunting) ? 1 : 0) - buntBlend) * 0.22;
            if (buntBlend < 0.002) buntBlend = 0;

            // バントの構えのあいだは、ボールが見えるようにバットを半透明にする（構えの補間に合わせて滑らかに変化）
            bat.material.opacity = 1 - (1 - BUNT_BAT_OPACITY) * buntBlend;
            bat.material.transparent = buntBlend > 0;
            bat.material.depthWrite = buntBlend === 0;

            // バント：指を離さずに構えたままボールが来たら、自動でバントした（振った）扱いにする。
            // 指を離して（バットを引いて）見送れば振っていないので、ボール球は「ボール」と判定される。
            if (buntMode && buntStance && isDragging && !isSwinging && gameState === 'pitching' &&
                ball.position.z >= 1.8 - BUNT_AUTO_TRIGGER_DIST && ball.position.z <= 1.8 + BUNT_AUTO_CONTACT_Z + 0.4) {
                isBunting = true;
                buntAuto = true;
                isSwinging = true;
                swingProgress = 0;
                swungOnCurrentPitch = true;
            }

            if (isSwinging) {
                // スイングのイージング付き進化形アニメーション (0.0 〜 1.0)
                // 自動バントは、ボールが通り過ぎるまでバットを構えたまま（進行を途中で止める）
                if (buntAuto && gameState === 'pitching') swingProgress = Math.min(swingProgress, 0.40);
                swingProgress += 0.055; 
                let p = Math.min(1.0, swingProgress);

                if (isBunting) {
                    // バント：構えたまま、バットを水平に保って投手側へ軽く押し出す（スイング動作・軌跡なし）
                    const pushT = Math.sin(Math.min(1, p / 0.55) * Math.PI * 0.5);
                    playerGroup.rotation.y = 0;
                    playerGroup.position.set(1.1, 0, 1.8);
                    pawaBatter.headGroup.rotation.y = BATTER_FACE_YAW;
                    pawaBatter.body.position.y = buntBodyY(1);
                    applyBuntCrouchParts(1);
                    applyBuntBat(1, pushT * 0.15);
                } else {

                // インパクトの瞬間 (p ≈ 0.42)
                let impactPhase = 0.42;

                // 1. テイクバック & 下半身回転 (腰→胸のキネティックチェーン)
                let bodyAngle = 0;
                let takebackPhase = 0.12;

                if (p < takebackPhase) {
                    // テイクバック（体重を軸足＝後ろ足にため込み、前足は軽く上げて小さく踏み込む準備）
                    let t = p / takebackPhase;
                    let loadT = Math.sin(t * Math.PI * 0.5);
                    bodyAngle = loadT * 0.15; // +0.15 rad
                    playerGroup.position.z = 1.8 + t * 0.08;
                    playerGroup.position.y = -loadT * 0.02; // 体重を沈み込ませる（ロード）
                    pawaBatter.leftLegGroup.rotation.y = BATTER_FOOT_YAW - t * 0.2;
                    pawaBatter.leftLegGroup.rotation.x = -loadT * 0.12; // 前足の踏み込み前の小さな上げ
                    pawaBatter.rightLegGroup.rotation.x = loadT * 0.08; // 軸足に体重を乗せて沈む
                } else {
                    // 爆発的回転（下半身が先行して回り、上半身が一拍遅れて追いつく＝運動連鎖）
                    let t = (p - takebackPhase) / (1.0 - takebackPhase);
                    // 前足の踏み込み（ステップ）：回転が始まる直前に地面へ着地する
                    let strideT = Math.min(1, t * 3.2);
                    let strideEase = strideT * strideT * (3 - 2 * strideT); // smoothstep
                    // イージング。腰（下半身）が先にキレよく回り始め、腕・バットはわずかに遅れてついてくる（運動連鎖のタメ）
                    let swingCurve = Math.pow(t, 1.15); 
                    let bodyRotAngle = 0.15 - swingCurve * 2.55; // +0.15 から -2.4 (約138度爆発回転)

                    // フォロースルー終盤は、回りすぎた分を自然に受け止めて少し戻る（振り切った反動）
                    if (t > 0.82) {
                        let recoilT = (t - 0.82) / 0.18;
                        bodyRotAngle += Math.sin(recoilT * Math.PI) * 0.10;
                    }
                    bodyAngle = bodyRotAngle;

                    playerGroup.position.z = 1.88 - Math.sin(t * Math.PI) * 0.06 - strideEase * 0.05; // 踏み込みでわずかに投手側へ体重移動
                    playerGroup.position.y = -0.02 + strideEase * 0.02 + Math.sin(Math.min(1, t * 1.4) * Math.PI) * 0.03; // 沈み込みからインパクトにかけて体が伸び上がる

                    // 軸足の回転 (爪先立ちで腰の切れを表現)
                    pawaBatter.rightLegGroup.rotation.y = BATTER_FOOT_YAW + swingCurve * 1.2;
                    pawaBatter.rightLegGroup.rotation.x = -Math.sin(swingCurve * Math.PI) * 0.3 + strideEase * 0.05; // 軸足のつま先立ち→蹴り出し
                    // 前足（踏み込み足）：ステップで着地してから、膝が割れて体重を受け止める
                    pawaBatter.leftLegGroup.rotation.y = BATTER_FOOT_YAW - 0.2 + swingCurve * 0.5;
                    pawaBatter.leftLegGroup.rotation.x = -0.12 * (1 - strideEase) + swingCurve * 0.15; // 着地の踏ん張りと、回転にともなう膝の割れ
                }

                playerGroup.rotation.y = bodyAngle;

                // 2. 頭部目線固定 (Head Keep - 体が回っても投手/ボールを見続ける)
                pawaBatter.headGroup.rotation.y = BATTER_FACE_YAW - bodyAngle;
                pawaBatter.headGroup.rotation.x = 0.1;

                // 3. ミート位置（コース・高さ）に応じたバットアングルアジャスト
                let cursorY = cursorGroup.position.y; // 0.35 ~ 1.55
                let cursorX = cursorGroup.position.x; // -1.2 ~ 1.2
                
                // 低めはヘッドが下がり、高めは水平になるダイナミック角度
                let pitchHeightFactor = (cursorY - 0.95) * 0.8; // 高低アングル
                let pitchSideFactor = cursorX * 0.3; // 左右アングル

                // 4. バットと腕のSwing軌道 (ラグ・しなり・インパクト・フォロースルー)
                let batSwingAngle = 0;
                let batTiltX = 0.4 - pitchHeightFactor * 0.5; // 高さごとのバット倒し角
                let batTiltZ = 0.8;

                if (p < takebackPhase) {
                    let t = p / takebackPhase;
                    batGroup.rotation.set(0.4 + t * 0.1, -Math.PI / 3 - t * 0.15, 0.8);
                } else {
                    let t = (p - takebackPhase) / (1.0 - takebackPhase);
                    // ラグ（遅れ）を持たせた鋭いスイング軌道：腰が先に回り、手・バットはタメてからインパクトにかけて一気に加速する
                    let batProgress = Math.pow(t, 1.55);
                    
                    // バットが体を中心に円弧を描く
                    let swingArc = batProgress * Math.PI * 1.25;
                    
                    // インパクト付近で腕が最大伸長
                    let armReach = Math.sin(Math.min(1.0, batProgress * 1.5) * Math.PI) * 0.25;
                    armPivot.position.x = -0.1 + pitchSideFactor * 0.3 + Math.cos(swingArc) * armReach;
                    armPivot.position.y = 0.4 + pitchHeightFactor * 0.4;
                    armPivot.position.z = 0.15 - Math.sin(swingArc) * armReach;

                    // バット自体の回転
                    let rx = batTiltX + Math.sin(batProgress * Math.PI) * 0.3;
                    let ry = -Math.PI / 3 + swingArc * 1.35;
                    let rz = batTiltZ - batProgress * 0.6;

                    // フォロースルーでバットを立てて背中に巻き込む
                    if (p > impactPhase) {
                        let followT = (p - impactPhase) / (1.0 - impactPhase);
                        rz -= followT * 0.8;
                        rx += followT * 0.4;
                    }

                    batGroup.rotation.set(rx, ry, rz);
                }

                // 5. バット軌跡（トレイル）のリアルタイムアップデート
                bat.geometry.computeBoundingBox();
                let batHeadLocal = new THREE.Vector3(0, 1.3, 0);
                let batMidLocal = new THREE.Vector3(0, 0.5, 0);
                
                let headWorldPos = batHeadLocal.clone().applyMatrix4(bat.matrixWorld);
                let midWorldPos = batMidLocal.clone().applyMatrix4(bat.matrixWorld);
                
                updateSwingTrail(headWorldPos, midWorldPos);

                } // ← 通常スイングの動作ここまで（バントのときは上の構えポーズのまま）

                // --- 打撃（ミート）判定 ---
                if (gameState === 'pitching' && (buntAuto ? Math.abs(ball.position.z - 1.8) < BUNT_AUTO_CONTACT_Z
                    : (p >= HIT_WINDOW_START && p <= HIT_WINDOW_END && Math.abs(ball.position.z - 1.8) < 1.5))) {
                    let dx = ball.position.x - cursorGroup.position.x; 
                    let dy = ball.position.y - cursorGroup.position.y; 
                    // タイミングが早い（＝引っ張り）ほど、カーソルが少しずれていても当たり、ミートの質も落ちにくい
                    // ボールが本塁に届く手前（z < 1.8）で当てるほど強く効く（0.5手前で最大）
                    const pullTiming = Math.max(0, Math.min(1, (1.8 - ball.position.z) / 0.5));
                    const forgive = PULL_FORGIVE * pullTiming;
                    let d = Math.max(0, Math.hypot(dx, dy) - forgive); 
                    
                    if (Math.abs(dx) < 0.6 + forgive && Math.abs(dy) < 0.28 + forgive * 0.5) {
                        if (stealAnimation && stealAnimation.started) {
                            stealAnimation.madeContact = true;
                            if (stealAnimation.runner) stealAnimation.runner.speed = RUNNER_SPEED;   // 打球になったら通常の走塁の速さ
                        }
                        gameState = 'running'; 
                        playResult = ""; 
                        fielderReactionLeft = FIELDER_REACTION_FRAMES; // 守備は打球を見てから動き出す
                        buntPlayActive = isBunting;                    // バントなら内野手は速く動き出す
                        buntPlayTier = (buntStanceTier !== null) ? buntStanceTier : currentBuntTimingTier();
                        if (isBunting) activateBuntCatcher();          // バントのときだけ捕手が守備に加わる
                        ballMarker.visible = false;
                        if (pendingPitch && pendingPitch.displayText) {
                            document.getElementById('pitchInfoDisplay').innerText = pendingPitch.displayText;
                        }
                        
                        let timingDiff = Math.abs(ball.position.z - 1.8);
                        let isBallPitch = Math.abs(ball.position.x) > 0.6 || ball.position.y < 0.4 || ball.position.y > 1.5;

                        let feedbackMsg = "GOOD!"; 
                        let feedbackClass = "good";

                        if (d < 0.11 && timingDiff < PERFECT_TIMING && !isBallPitch) { // カーソルとの距離もより厳しく（元: 0.18）
                            feedbackMsg = "PERFECT!";
                            feedbackClass = "hr";
                            sound.playHit(true);
                        } else if (d > 0.42 || timingDiff > POOR_TIMING) {
                            feedbackMsg = "POOR CONTACT";
                            feedbackClass = "miss";
                            sound.playHit(false);
                        } else if (isBallPitch) {
                            feedbackMsg = "BALL PITCH";
                            feedbackClass = "miss";
                            sound.playHit(false);
                        } else {
                            sound.playHit(false);
                        }
                        showTxt(isBunting ? "BUNT!" : feedbackMsg, feedbackClass);

                        triggerHitParticles(new THREE.Vector3(ball.position.x, ball.position.y, 1.8));

                        let timingOffset = 1.8 - ball.position.z;
                        let timingAngleX = timingOffset * TIMING_ANGLE_X;

                        // ボールがバットのどこに当たったか（-1:下端 〜 0:中央 〜 +1:上端）
                        const contactY = CONTACT_DIR * Math.max(-1, Math.min(1, dy / 0.28));
                        // 上側 → 高く上がる / 中央 → ライナー / 下側 → 打球が地面へ向かいゴロになる
                        let launchAngleY = 0.22 + contactY * (contactY > 0 ? UPPER_HIT_ANGLE : LOWER_HIT_ANGLE);
                        let launchAngleX = (-dx * SIDE_HIT_ANGLE + timingAngleX) * FAIR_SIDE_SCALE; 
                        let power = 0.90 + (0.35 - d) * 1.45 + (0.28 - timingDiff) * 0.85;
                        // 高く上げるほどエネルギーが縦に逃げ、打球は詰まる（フライになっても飛びすぎない）
                        if (contactY > 0) power /= (1 + contactY * UPPER_HIT_DAMPING);
                        // 芯（バットの中心）からズレるほど打球速度が落ちる。特に上下のズレに強く効かせる
                        const offY = Math.abs(contactY);
                        const offX = Math.min(1, Math.abs(dx) / 0.6);
                        power *= (1 - OFFCENTER_Y_DAMPING * Math.pow(offY, OFFCENTER_Y_CURVE));
                        power *= (1 - OFFCENTER_X_DAMPING * Math.pow(offX, 1.5));

                        if (feedbackMsg === "PERFECT!") {
                            launchAngleY += 0.38 * Math.min(1, Math.max(0, 1 + contactY * 1.5)); 
                            power *= 1.40;
                        } else if (feedbackMsg === "GOOD!") {
                            launchAngleY += 0.05; 
                            power *= GOOD_POWER_SCALE; // GOOD時の打球の伸び（元: 0.50）
                        } else if (feedbackMsg === "POOR CONTACT" || feedbackMsg === "BALL PITCH") {
                            power *= 0.30;
                            launchAngleY *= 0.5;
                        } else {
                            power *= 0.50;
                        }

                        if (isBunting) {
                            // バント：バットを寝かせて当てるだけなので、打球は弱いゴロ。芯でうまく殺すほど転がりが弱い。
                            power = feedbackMsg === "PERFECT!" ? BUNT_POWER_PERFECT
                                  : (feedbackMsg === "GOOD!" ? BUNT_POWER_GOOD : BUNT_POWER_POOR);
                            launchAngleY = BUNT_ANGLE_BASE + contactY * BUNT_ANGLE_Y;
                            // 選んだ方向（三塁線／投手前／一塁線）へ転がす。当たりのズレぶんだけ少しばらつく
                            launchAngleX = BUNT_DIRS[buntDirIndex].dir * BUNT_DIR_LAUNCH_X + (launchAngleX / FAIR_SIDE_SCALE) * BUNT_SIDE_SCALE; // バントは従来どおり（FAIR_SIDE_SCALE の縮小を戻す）
                        }

                        power = Math.max(isBunting ? 0.06 : 0.18, Math.min(2.30, power)); // バントは弱い当たりを許すため下限を下げる

                        ballVel.set(launchAngleX * power * 1.30, launchAngleY * power, -power * 1.35);
                        // 打球の発射角（水平面に対する仰角）を保存。エンドラン時の外野フライ判定に使用。
                        hitLaunchAngleDeg = Math.atan2(
                            ballVel.y,
                            Math.hypot(ballVel.x, ballVel.z)
                        ) * 180 / Math.PI;

                        batterRunner = activeRunners.find(r => !r.isActive);
                        if (batterRunner) batterRunner.spawn(0, 1);
                        
                        // フライ・ライナーが上がったら、元からいる走者はハーフウェイまで出て様子を見る。
                        // ゴロ（低い打球）のときは、これまでどおり打球の行方が分かるまで元の塁を維持する。
                        const isAirBall = hitLaunchAngleDeg !== null && hitLaunchAngleDeg >= FLY_LINER_MIN_ANGLE_DEG;
                        // 外野手に空中で捕られそうな打球なら、2・3塁走者はハーフウェイに出ず、塁に残ってタッチアップに備える
                        const airCatcherIdx = isAirBall ? predictAirCatcherIndex() : null;
                        // 2アウトのときは、捕られても3アウト目でチェンジなので、ハーフウェイで待たずに打球と同時に走る
                        const twoOutRun = isAirBall && outs >= 2;
                        // バントのときは、全走者が打球と同時に1つ先の塁へスタートする（送りバント）
                        contactRunPlay = twoOutRun || isBunting;
                        activeRunners.forEach(r => {
                            if (!r.isActive || r === batterRunner) return;
                            r.holdProgress = null;
                            const isEndRunRunner = !!(stealAnimation && r === stealAnimation.runner);
                            // タッチアップ優先：外野フライが捕られそうなとき、3塁走者（右翼手なら2塁走者も）は塁に残る
                            const tagUpStay = isAirBall && !isEndRunRunner && outs < 2 && airCatcherIdx !== null && airCatcherIdx >= 5 && airCatcherIdx < 8 &&
                                (r.startSegment === 3 || (r.startSegment === 2 && airCatcherIdx === 7));
                            if (twoOutRun || isBunting) {
                                // 2アウト／バント：ハーフウェイ待機なしで、そのまま次の塁へ走り続ける
                                r.targetSegment = Math.min(4, r.startSegment + 1);
                                r.speed = RUNNER_SPEED;
                                if (!isEndRunRunner) {
                                    const segLen2 = getPathCoord(r.startSegment).distanceTo(getPathCoord(Math.min(4, r.startSegment + 1)));
                                    r.currentSegment = r.startSegment;
                                    r.progress = Math.min(0.5, LEAD_OFF_DISTANCE / segLen2); // リード位置から途切れず走り出す
                                }
                            } else if (tagUpStay) {
                                const segLen = getPathCoord(r.startSegment).distanceTo(getPathCoord(Math.min(4, r.startSegment + 1)));
                                r.currentSegment = r.startSegment;
                                r.targetSegment = r.startSegment;
                                r.progress = Math.min(0.5, LEAD_OFF_DISTANCE / segLen); // リード位置から塁へ戻って待つ
                                r.speed = RUNNER_SPEED;
                            // エンドランで走り出していた走者も、最初の塁間にいればハーフウェイ扱いにする
                            } else if (isAirBall && (!isEndRunRunner || r.currentSegment === r.startSegment)) {
                                r.targetSegment = Math.min(4, r.startSegment + 1);
                                r.speed = RUNNER_SPEED;
                                r.holdProgress = 0.5;
                                if (!isEndRunRunner) {
                                    const segLen = getPathCoord(r.startSegment).distanceTo(getPathCoord(Math.min(4, r.startSegment + 1)));
                                    r.currentSegment = r.startSegment;
                                    r.progress = Math.min(0.5, LEAD_OFF_DISTANCE / segLen); // リード位置から途切れず出ていく
                                }
                                // エンドランの走者は今の位置から（0.5を過ぎていれば戻りながら）ハーフウェイへ向かう
                            } else {
                                r.targetSegment = r.startSegment;
                            }
                        });

                        playerGroup.visible = false; 
                    }
                }

                // スイング完了リセット
                if (p >= 1.0) {
                    const wasBunting = isBunting;
                    isSwinging = false;
                    swingProgress = 0;
                    isBunting = false;
                    buntAuto = false;
                    buntStance = false;
                    resetSwingTrail();
                    playerGroup.rotation.y = 0;
                    playerGroup.position.set(wasBunting ? 1.1 + buntBodyShiftCur : 1.1, 0, 1.8);
                    pawaBatter.rightLegGroup.rotation.set(0, BATTER_FOOT_YAW, 0);
                    pawaBatter.leftLegGroup.rotation.set(0, BATTER_FOOT_YAW, 0);
                    if (!wasBunting) {
                        pawaBatter.headGroup.rotation.set(0.1, BATTER_FACE_YAW, 0);
                        armPivot.position.set(-0.1, 0.4, 0.15);
                        batGroup.rotation.set(0.4, -Math.PI / 3, 0.8);
                    }
                    // バントのあとの構えは、待機状態の補間で自然に通常の構えへ戻る
                }
            } else {
                // --- 投球待ち状態（Idle Stance）のリアリティ向上モーション ---
                idleTimer += 0.04;
                let idleWiggleY = Math.sin(idleTimer * 2.5) * 0.03;
                let idleBatShake = Math.sin(idleTimer * 3.5) * 0.05;
                
                let targetY = 0.4 + (cursorGroup.position.y - 0.95) * 0.5 + idleWiggleY * 0.5;
                let targetX = -0.1 + (cursorGroup.position.x) * 0.2;

                if (buntBlend > 0) {
                    // バントの構え（スワイプ開始で屈み、バットを地面と平行に）。通常の構えとの間は滑らかに補間
                    applyBuntBat(buntBlend, 0);
                    pawaBatter.body.position.y = buntBodyY(buntBlend);
                } else {
                    armPivot.position.y = THREE.MathUtils.lerp(armPivot.position.y, targetY, 0.15);
